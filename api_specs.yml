    tags:
      - Policies
      - Conditions
      - Entitlements
      - Ringfence Rules
      - Admin Roles
      - Criteria Scripts
      - Entitlement Scripts
  - name: Identity
    tags:
      - Client Profiles
      - Identity Providers
      - IP Pools
      - MFA Providers
      - Device Claim Scripts
      - User Claim Scripts
      - Local Users
      - Service Users
  - name: System
    tags:
      - Appliances
      - Replication Targets
      - Sites
      - Tags
      - Appliance Customizations
      - Trusted Certificates
      - Secrets Manager
      - Client Auto-Update
      - Certificate Authority
      - Appliance Change
      - Appliance Upgrade
      - Appliance Backup
      - Appliance Metrics
  - name: Usage
    tags:
      - Active Sessions
      - Active Brokered Sessions
      - Recorded Sessions
      - Client Logs
      - Discovered Apps
      - Health
      - Registered Devices
      - Blacklisted Users
      - Licensed Users
      - Default Time-Based OTP Provider Seeds
      - FIDO2 Devices
      - Issued Certificates
  - name: Settings
    tags:
      - Global Settings
      - MFA for Admins
      - License
      - ZTP
      - Replication Source
  - name: Other
    tags:
      - Admin Preferences

