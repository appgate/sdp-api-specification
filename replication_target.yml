replication-targets:
  get:
    summary: List all Replication Targets.
    description: List all Replication Targets visible to current user.
    tags:
      - Replication Targets
    parameters:
      - $ref: './common.yml#/parameters/query'
      - $ref: './common.yml#/parameters/range'
      - $ref: './common.yml#/parameters/orderBy'
      - $ref: './common.yml#/parameters/descending'
      - $ref: './common.yml#/parameters/filterBy'
    responses:
      '200':
        description: List of Replication Targets.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ReplicationTargetList'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
  post:
    summary: Create a new Replication Target.
    description: Create a new Replication Target.
    tags:
      - Replication Targets
    responses:
      '200':
        description: Created Replication Target.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ReplicationTarget'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '409':
        $ref: './common.yml#/responses/ConflictError'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      $ref: '#/requestBodies/ReplicationTarget'

replication-targets-bulk-upsert:
  post:
    summary: Bulk upsert Replication Targets.
    description: Create or update multiple replication targets in a single request.
    tags:
      - Replication Targets
    responses:
      '200':
        description: Bulk upsert report.
        content:
          application/json:
            schema:
              $ref: './common.yml#/definitions/BulkUpsertReport'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      required: true
      description: Bulk upsert request.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/ReplicationTarget'
replication-targets-id:
  get:
    summary: Get a specific Replication Target.
    description: Get a specific Replication Target.
    tags:
      - Replication Targets
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Single Replication Target.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ReplicationTarget'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
  put:
    summary: Update an existing Replication Target.
    description: Update an existing Replication Target.
    tags:
      - Replication Targets
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Updated Replication Target.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ReplicationTarget'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      $ref: '#/requestBodies/ReplicationTarget'
  delete:
    summary: Delete a specific Replication Target.
    description: Delete a specific Replication Target.
    tags:
      - Replication Targets
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '204':
        description: Replication Target was deleted successfully.
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
replication-targets-id-export:
  get:
    summary: Export replication target registration token.
    description: Export a registration token for a replication target that is not connected.
    tags:
      - Replication Targets
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Registration token for the replication target.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ReplicationTargetRegistrationToken'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '412':
        description: Registration token can only be exported for non-connected targets.
        content:
          application/json:
            schema:
              $ref: './common.yml#/definitions/Error'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
replication-targets-register:
  post:
    summary: Register a replication target.
    description: Register a replication target using a provided registration token.
    tags:
      - Replication Targets
    requestBody:
      $ref: '#/requestBodies/ReplicationTargetRegistrationToken'
    responses:
      '200':
        description: Replication target registration response.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ReplicationTargetRegistrationResponse'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '412':
        description: Replication target is already registered.
        content:
          application/json:
            schema:
              $ref: './common.yml#/definitions/Error'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
replication-targets-unregister:
  post:
    summary: Unregister a replication target.
    description: Unregister a replication target setting its status to Not Connected. This API endpoint can only be used by target collectives.
    tags:
      - Replication Targets
    responses:
      '204':
        description: Replication target was unregistered successfully.
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
replication-targets-status:
  post:
    summary: Update replication target state.
    description: Update replication status and/or last replication timestamp for a Replication Target. This API endpoint can only be used by target collectives.
    tags:
      - Replication Targets
    requestBody:
      $ref: '#/requestBodies/ReplicationTargetStatusUpdate'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '#/definitions/ReplicationTarget'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'

requestBodies:
  ReplicationTarget:
    content:
      application/json:
        schema:
          $ref: '#/definitions/ReplicationTarget'
    description: Replication Target object.
    required: true
  ReplicationTargetStatusUpdate:
    content:
      application/json:
        schema:
          $ref: '#/definitions/ReplicationStatusUpdate'
    description: Replication Target status update request. It's an internal API to be used by the replication service of the target collective.
    required: true
  ReplicationTargetRegistrationToken:
    content:
      application/json:
        schema:
          $ref: '#/definitions/ReplicationTargetRegistrationToken'
    description: Registration token for replication target registration.
    required: true

definitions:
  ReplicationTargetList:
    allOf:
      - $ref: './common.yml#/definitions/ResultList'
      - type: object
        description: Represents a list of Replication Targets.
        properties:
          data:
            type: array
            description: List of Replication Targets.
            items:
              $ref: '#/definitions/ReplicationTarget'
  ReplicationTarget:
    type: object
    description: Represents a Replication Target.
    required:
      - name
    properties:
      id:
        type: string
        format: uuid
        description: ID of the object.
        example: 4c07bc67-57ea-42dd-b702-c2d6c45419fc
      name:
        type: string
        description: Name of the object.
        example: object
      notes:
        type: string
        description: Notes for the object. Used for documentation purposes.
        example: This object has been created for test purposes.
      created:
        type: string
        format: date-time
        description: Create date.
        readOnly: true
      updated:
        type: string
        format: date-time
        description: Last update date.
        readOnly: true
      replicationTags:
        type: array
        description: Tags used for selecting items to replicate to this target. The tag builtin is not permitted.
        items:
          type: string
      status:
        type: string
        description: Replication status.
        readOnly: true
        enum:
          - notConnected
          - healthy
          - warning
          - error
      lastReplicationTime:
        type: string
        format: date-time
        description: Last replication timestamp.
        readOnly: true
      sourceHealthMessage:
        type: string
        description: Source-side health check message that explains a controller-detected issue affecting this target’s status.
        readOnly: true
      lastReplicationDetails:
        $ref: './replication_source.yml#/definitions/ReplicationDetails'
  ReplicationStatusUpdate:
    type: object
    description: Update status and details for the last replication attempt.
    required:
      - status
      - lastReplicationTime
      - nextReplicationTime
    properties:
      status:
        type: string
        description: Replication status.
        enum:
          - notConnected
          - error
          - warning
          - healthy
      lastReplicationTime:
        type: string
        format: date-time
        description: Last replication timestamp.
      nextReplicationTime:
        type: string
        format: date-time
        description: Scheduled timestamp for the next replication attempt.
      lastReplicationDetails:
        $ref: './replication_source.yml#/definitions/ReplicationDetails'
  ReplicationTargetRegistrationToken:
    type: object
    required:
      - token
    properties:
      token:
        type: string
        description: Registration token provided by the replication target.
        example: <base64 token>
  ReplicationTargetRegistrationResponse:
    type: object
    properties:
      spaKey:
        type: string
        description: SPA key assigned to the replication target.
      accessToken:
        type: string
        description: Access token for the replication service to login with.

components:
  schemas:
    ReplicationTarget:
      $ref: '#/definitions/ReplicationTarget'
