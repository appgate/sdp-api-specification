entitlements:
  get:
    summary: List all Entitlements.
    description: List all Entitlements visible to current user.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/query'
      - $ref: './common.yml#/parameters/range'
      - $ref: './common.yml#/parameters/orderBy'
      - $ref: './common.yml#/parameters/descending'
      - $ref: './common.yml#/parameters/filterBy'
    responses:
      '200':
        description: List of Entitlements.
        content:
          application/json:
            schema:
              $ref: '#/definitions/EntitlementList'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
  post:
    summary: Create a new Entitlement.
    description: Create a new Entitlement.
    tags:
      - Entitlements
    responses:
      '200':
        description: Created Entitlement.
        content:
          application/json:
            schema:
              $ref: '#/definitions/AnyEntitlement'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '409':
        $ref: './common.yml#/responses/ConflictError'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      $ref: '#/requestBodies/Entitlement'
entitlements-bulk-upsert:
  post:
    summary: Bulk upsert Entitlements.
    description: Create or update multiple entitlements in a single request.
    tags:
      - Entitlements
    responses:
      '200':
        description: Bulk upsert report.
        content:
          application/json:
            schema:
              $ref: './common.yml#/definitions/BulkUpsertReport'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      required: true
      description: Bulk upsert request.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/AnyEntitlement'
entitlements-id:
  get:
    summary: Get a specific Entitlement.
    description: Get a specific Entitlement.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Single Entitlement.
        content:
          application/json:
            schema:
              $ref: '#/definitions/AnyEntitlement'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
  put:
    summary: Update an existing Entitlement.
    description: Update an existing Entitlement.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Updated Entitlement.
        content:
          application/json:
            schema:
              $ref: '#/definitions/AnyEntitlement'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      $ref: '#/requestBodies/Entitlement'
  delete:
    summary: Delete a specific Entitlement.
    description: Delete a specific Entitlement.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '204':
        description: Entitlement was deleted successfully.
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
entitlements-id-optimization:
  get:
    summary: Get optimization details for a specific Entitlement.
    description: >-
      Returns optimization details for a specific Entitlement, including a suggested operation and suggested action removals based on usage data.
      Requires the Optimizer licensed feature.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Optimization details for the Entitlement.
        content:
          application/json:
            schema:
              $ref: '#/definitions/EntitlementOptimization'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '402':
        $ref: './common.yml#/responses/PaymentError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '412':
        description: Precondition failed. ZTP is not registered or Optimizer is not enabled.
        content:
          application/json:
            schema:
              $ref: './common.yml#/definitions/Error'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
entitlements-optimization-stats:
  get:
    summary: Get aggregate optimization stats for all Entitlements.
    description: >-
      Returns aggregate counts of Entitlements grouped by optimization score, used to power dashboard widgets.
      Requires the Optimizer licensed feature.
    tags:
      - Entitlements
    responses:
      '200':
        description: Aggregate optimizer stats.
        content:
          application/json:
            schema:
              $ref: '#/definitions/EntitlementOptimizerStats'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '402':
        $ref: './common.yml#/responses/PaymentError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '412':
        description: Precondition failed. ZTP is not registered or Optimizer is not enabled.
        content:
          application/json:
            schema:
              $ref: './common.yml#/definitions/Error'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
app-shortcuts-groups:
  get:
    summary: Get a list of group names.
    description: Get a list of group names currently in use by other App-Shortcuts.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/query'
    responses:
      '200':
        description: List of group names.
        content:
          application/json:
            schema:
              $ref: '#/definitions/GroupNamesList'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
cloud-migrations:
  post:
    summary: Migrate Entitlement host cloud resources in deprecated format to current format.
    description: Migrates Entitlement Action's hosts referencing cloud resources in deprecated format to current format.
    tags:
      - Entitlements
    parameters:
      - name: dry-run
        in: query
        description: When true, migration items are detected, but not migrated. Defaults to true.
        schema:
          type: boolean
          example: false
        required: false
    responses:
      '200':
        description: List of hosts containing formats that have been changed.
        content:
          application/json:
            schema:
              $ref: '#/definitions/EntitlementMigrationInfoList'
      '204':
        description: No hosts requiring migrations were found.
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'

requestBodies:
  Entitlement:
    content:
      application/json:
        schema:
          $ref: '#/definitions/AnyEntitlement'
    description: Entitlement object. Use the `type` field to specify the entitlement type (Network, BrokeredRdp, BrokeredSsh).
    required: true

definitions:
  HttpMethod:
    type: string
    enum:
      - GET
      - HEAD
      - POST
      - PUT
      - DELETE
      - CONNECT
      - OPTIONS
      - TRACE
      - PATCH
      - MKCOL
      - COPY
      - MOVE
      - PROPFIND
      - PROPPATCH
      - LOCK
      - UNLOCK
  IpAccessActionType:
    type: string
    description: Applied action to the traffic.
    enum:
      - allow
      - block
      - alert
      - exclude
  IpAccessSubtype:
    type: string
    description: Type of the IP Access action. Required unless the action is exclude.
    enum:
      - icmp_up
      - icmp_down
      - icmpv6_up
      - icmpv6_down
      - udp_up
      - udp_down
      - tcp_up
      - tcp_down
      - ah_up
      - ah_down
      - esp_up
      - esp_down
      - gre_up
      - gre_down
      - http_up
  AnyEntitlement:
    description: >-
      An Entitlement of any type. The shape of the object depends on the `type` field.
      Use the `type` discriminator to determine which fields are present.
    oneOf:
      - $ref: '#/definitions/Entitlement'
      - $ref: '#/definitions/BrokeredRdpEntitlement'
      - $ref: '#/definitions/BrokeredSshEntitlement'
    discriminator:
      propertyName: type
      mapping:
        Network: '#/definitions/Entitlement'
        BrokeredRdp: '#/definitions/BrokeredRdpEntitlement'
        BrokeredSsh: '#/definitions/BrokeredSshEntitlement'

  EntitlementList:
    allOf:
      - $ref: './common.yml#/definitions/ResultList'
      - type: object
        description: Represents a list of Entitlements.
        properties:
          data:
            type: array
            description: List of Entitlements.
            items:
              $ref: '#/definitions/AnyEntitlement'
  ShortcutColorCode:
    type: integer
    minimum: 1
    maximum: 20
    description: |
      The color code of the shortcut on the client.
      - 1: Light Green
      - 2: Green
      - 3: Indigo
      - 4: Deep Purple
      - 5: Yellow
      - 6: Lime
      - 7: Light Blue
      - 8: Blue
      - 9: Amber
      - 10: Orange
      - 11: Cyan
      - 12: Teal
      - 13: Deep Orange
      - 14: Red
      - 15: Gray
      - 16: Brown
      - 17: Pink
      - 18: Purple
      - 19: Blue Gray
      - 20: Near Black
    default: 1

  EntitlementType:
    type: string
    description: The type of the Entitlement.
    enum:
      - Network
      - BrokeredRdp
      - BrokeredSsh
    default: Network
    example: Network

  BaseEntitlementFields:
    type: object
    description: Fields shared by all Entitlement types.
    required:
      - site
      - conditions
    properties:
      type:
        $ref: '#/definitions/EntitlementType'
      disabled:
        type: boolean
        description: If true, the Entitlement will be disregarded during authorization.
        default: false
      site:
        type: string
        format: uuid
        x-uuid-ref: Site
        description: ID of the Site for this Entitlement.
        example: 4c07bc67-57ea-42dd-b702-c2d6c45419fc
      siteName:
        type: string
        readOnly: true
        description: Name of the Site for this Entitlement. For convenience only.
        example: Default Site
      conditionLogic:
        type: string
        description: Whether all the Conditions must succeed to have access to this Entitlement or just one.
        enum:
          - and
          - or
        default: and
      conditions:
        type: array
        minItems: 1
        description: List of Condition IDs applied to this Entitlement.
        items:
          x-uuid-ref: Condition
          type: string
          format: uuid
          example: 4c07bc67-57ea-42dd-b702-c2d6c45419fc
      optimizationScore:
        type: string
        readOnly: true
        description: >-
          Indicates how optimized this Entitlement is based on usage data.
          Actions or hosts/ports/types/methods marked as optimizationExempt are excluded from this calculation.
          Licensed feature.
        enum:
          - NotLinked
          - Unused
          - Overprovisioned
          - InsufficientData
          - NotInUse
          - NotAnalyzed
          - OptimizedWithExemptions
          - Optimized
        default: InsufficientData
      optimizationScorePercentage:
        type: integer
        readOnly: true
        description: >-
          Numeric percentage score representing how optimized this Entitlement is based on usage data.
          Licensed feature.

  SessionRecording:
    type: object
    description: Session recording configuration.
    properties:
      enabled:
        type: boolean
        description: Whether sessions to this entitlement are recorded.
        default: false
      disclosureMessage:
        type: string
        description: Disclosure message shown to the user before the session starts. Only relevant when enabled is true.
        default: This session has policy conditions set by the administrator that allow for session recording and live monitoring. Proceeding means you accept those policy conditions. If you do not wish to continue, please go back.

  BrokeredShortcut:
    type: object
    description: Shortcut configuration for the brokered session, displayed to the user in the client.
    required:
      - name
    properties:
      name:
        type: string
        description: Name for the shortcut which will be visible on the Client UI.
        example: Win desktop u3543
      description:
        type: string
        description: Description for the shortcut which will be visible on the Client UI.
        default: ''
        example: This is information that will appear in the client, for the user to read.
      groupName:
        type: string
        description: Group name this shortcut is to be grouped by in the client.
        example: Remote Desktops
      colorCode:
        $ref: '#/definitions/ShortcutColorCode'

  BrokeredEntitlementBase:
    allOf:
      - $ref: './common.yml#/definitions/BaseEntity'
      - $ref: '#/definitions/BaseEntitlementFields'
      - type: object
        description: Access configuration fields shared by all brokered entitlement types.
        required:
          - host
          - port
          - appShortcut
        properties:
          host:
            type: string
            description: Hostname or IP address of the target host.
            example: 192.34.220.15
          port:
            type: integer
            minimum: 1
            maximum: 65535
            description: Port number of the target host.
            example: 3389
          sessionRecording:
            $ref: '#/definitions/SessionRecording'
          credentials:
            type: string
            format: uuid
            x-uuid-ref: Secret
            description: >-
              ID of the Credentials secret used for injection at session establishment.
              The secret must be of the Credentials or SSH Key type.
            example: 4c07bc67-57ea-42dd-b702-c2d6c45419fc
          appShortcut:
            $ref: '#/definitions/BrokeredShortcut'
          clipboardSharing:
            type: boolean
            default: false
            description: Whether clipboard sharing between Client and remote host is permitted for this Entitlement.
          fileTransfer:
            type: boolean
            default: false
            description: Whether file transfers between Client and remote host are permitted for this Entitlement.
          idleTimeoutMinutes:
            type: integer
            minimum: 1
            maximum: 1440
            default: 30
            description: Idle-session timeout in minutes. The session is terminated after this many minutes without user activity.

  BrokeredRdpEntitlement:
    allOf:
      - $ref: '#/definitions/BrokeredEntitlementBase'
      - type: object
        description: Represents a Brokered RDP Entitlement providing interactive RDP access to a target host.
        properties:
          type:
            type: string
            enum:
              - BrokeredRdp
          resolution:
            type: string
            enum:
              - 1024x768
              - 1280x720
              - 1920x1080
            default: 1280x720
            description: Screen resolution to negotiate with the RDP server for the session.
          colorDepth:
            type: integer
            enum: [ 8, 16, 24 ]
            default: 16
            description: Color depth, in bits per pixel, to negotiate with the RDP server for the session.
          keyboardLayout:
            type: string
            enum:
              - en-us-qwerty
              - en-gb-qwerty
              - de-de-qwertz
              - fr-fr-azerty
              - fr-be-azerty
              - fr-ch-qwertz
              - de-ch-qwertz
              - hu-hu-qwertz
              - it-it-qwerty
              - ja-jp-qwerty
              - no-no-qwerty
              - pt-br-qwerty
              - es-es-qwerty
              - es-latam-qwerty
              - sv-se-qwerty
              - tr-tr-qwerty
              - failsafe
            description: >-
              Keyboard layout advertised to the RDP server. If omitted, the server's default layout is used.
          windowsDomain:
            type: string
            description: >-
              Optional Windows domain to use when authenticating against the RDP server. If omitted, no domain is sent.
          securityMode:
            type: string
            enum:
              - nla
              - nla-ext
              - tls
              - rdp
              - vmconnect
              - any
            default: nla
            description: >-
              RDP security protocol to negotiate with the target host.
              `nla` (Network Level Authentication) is preferred; `any` lets the server pick.
          audioRedirection:
            type: boolean
            default: false
            description: Whether audio redirection from the remote host to the Client is permitted for this Entitlement.

  BrokeredSshEntitlement:
    allOf:
      - $ref: '#/definitions/BrokeredEntitlementBase'
      - type: object
        description: Represents a Brokered SSH Entitlement providing interactive SSH access to a target host.
        properties:
          type:
            type: string
            enum:
              - BrokeredSsh
          terminalType:
            type: string
            enum:
              - ansi
              - vt220
              - linux
              - xterm
              - xterm-256color
            default: xterm-256color
            description: Terminal type advertised to the SSH server for the session (TERM environment variable).
          keepAliveIntervalSeconds:
            type: integer
            minimum: 0
            maximum: 30
            default: 30
            description: >-
              Interval, in seconds, between SSH keep-alive messages sent to the target host.
              Must be `0` (disabled) or between `2` and `30`.
          hostKeyVerificationPolicy:
            type: string
            enum:
              - OFF
              - TOFU
              - ENFORCED
            default: ENFORCED
            description: >-
              Host key verification policy applied when establishing the SSH session.
              `OFF` disables verification, `TOFU` (trust-on-first-use) records the host key on first connection and enforces it thereafter,
              `ENFORCED` requires a pre-known host key.

  Entitlement:
    allOf:
      - $ref: './common.yml#/definitions/BaseEntity'
      - $ref: '#/definitions/BaseEntitlementFields'
      - type: object
        description: Represents a Network Entitlement.
        required:
          - actions
        properties:
          actions:
            type: array
            description: List of all IP Access actions in this Entitlement.
            items:
              type: object
              description: IP Access action.
              required:
                - action
                - hosts
              properties:
                subtype:
                  $ref: '#/definitions/IpAccessSubtype'
                action:
                  $ref: '#/definitions/IpAccessActionType'
                hosts:
                  type: array
                  description: Hosts to apply the action to. See admin manual for possible values.
                  items:
                    type: string
                  example:
                    - 10.0.0.1
                    - 10.0.0.0/24
                    - hostname.company.com
                    - 'dns://hostname.company.com'
                    - 'aws://security-group:accounting'
                ports:
                  type: array
                  description: >-
                    Destination port.
                    Multiple ports can be entered comma separated.
                    Port ranges can be entered dash separated.
                    Only valid for tcp, udp, ssh, and rdp subtypes
                  items:
                    type: string
                  example:
                    - 80
                    - 1024-65535
                types:
                  type: array
                  description: ICMP type. Only valid for icmp subtypes.
                  items:
                    type: string
                  example:
                    - 0-255
                methods:
                  type: array
                  description: HTTP method. Only valid for http subtypes. Leave it empty to allow all types.
                  items:
                    $ref: '#/definitions/HttpMethod'
                monitor:
                  type: object
                  description: >-
                    Only available for tcp_up and http_up subtypes.
                    If enabled, Gateways will monitor this action for responsiveness and act accordingly.
                    See admin manual for more details.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    timeout:
                      type: integer
                      description: Number of seconds the action needs to be unresponsive to mark the action unhealthy.
                      default: 30
                optimizationExemptHosts:
                  type: array
                  description: >-
                    Hosts exempt from Entitlement Optimization analysis.
                    Traffic to these hosts will not be considered when calculating the optimization score for this action.
                    Uses the same format as hosts.
                  items:
                    type: string
                  example:
                    - 10.0.0.1
                    - hostname.company.com
                optimizationExemptPorts:
                  type: array
                  description: >-
                    Destination ports exempt from Entitlement Optimization analysis.
                    Traffic on these ports will not be considered when calculating the optimization score for this action.
                    Only valid for tcp, udp, ssh, and rdp subtypes. Uses the same format as ports.
                  items:
                    type: string
                  example:
                    - 8080
                    - 9000-9100
                optimizationExemptTypes:
                  type: array
                  description: >-
                    ICMP types exempt from Entitlement Optimization analysis.
                    Traffic of these types will not be considered when calculating the optimization score for this action.
                    Only valid for icmp subtypes. Uses the same format as types.
                  items:
                    type: string
                  example:
                    - 0-255
                optimizationExemptMethods:
                  type: array
                  description: >-
                    HTTP methods exempt from Entitlement Optimization analysis.
                    Traffic using these methods will not be considered when calculating the optimization score for this action.
                    Only valid for http subtypes.
                  items:
                    $ref: '#/definitions/HttpMethod'
          appShortcuts:
            type: array
            description: Array of App Shortcuts.
            items:
              $ref: '#/definitions/AppShortcut'
          appShortcutScripts:
            type: array
            description: List of Entitlement Script IDs used for creating App Shortcuts dynamically.
            items:
              x-uuid-ref: EntitlementScript
              type: string
              format: uuid
              example: 4c07bc67-57ea-42dd-b702-c2d6c45419fc
  AppShortcut:
    type: object
    description: Publishes the configured URL as an app on the client using the display name as the app name.
    required:
      - name
      - url
    properties:
      name:
        type: string
        description: Name for the App Shortcut which will be visible on the Client UI.
        example: Accounting Software
      description:
        type: string
        description: Description for the App Shortcut which will be visible on the Client UI.
        example: This app will get you to the Accounting Software.
      url:
        type: string
        description: The URL that will be triggered on the OS to be handled. For example, an HTTPS URL will start the browser for the given URL.
        example: "https://service.company.com"
      colorCode:
        $ref: '#/definitions/ShortcutColorCode'
      groupName:
        type: string
        description: The group name this shortcut is to be grouped by
        example: Accounting Applications
  EntitlementOptimizerStats:
    type: object
    description: Aggregate counts of Entitlements grouped by optimization score.
    properties:
      total:
        type: integer
        description: Total number of Entitlements considered by the optimizer.
        example: 42
      optimizedPercent:
        type: integer
        minimum: 0
        maximum: 100
        description: Percentage of Entitlements currently considered optimized.
        example: 71
      optimized:
        type: integer
        description: Number of Entitlements whose access aligns with observed usage.
        example: 30
      overprovisioned:
        type: integer
        description: Number of Entitlements granting more access than is being used.
        example: 5
      unused:
        type: integer
        description: Number of Entitlements with no observed usage.
        example: 4
      unlinked:
        type: integer
        description: Number of Entitlements that could not be correlated with observed traffic.
        example: 2
      insufficientData:
        type: integer
        description: Number of Entitlements with insufficient usage data to evaluate.
        example: 1
      notInUse:
        type: integer
        description: Number of Entitlements that are disabled.
        example: 0
      graphData:
        type: array
        description: >-
          Daily optimized-percent samples for graph visualization, one entry per day
          for the last 30 days. `daysAgo` is the X axis (0 = today, 30 = 30 days ago);
          `percent` is the Y axis (the optimized percentage on that day).
        items:
          type: object
          properties:
            daysAgo:
              type: integer
              minimum: 0
              maximum: 30
              description: Number of days before today this sample represents.
              example: 0
            percent:
              type: integer
              minimum: 0
              maximum: 100
              description: Percentage of Entitlements considered optimized on that day.
              example: 71
  EntitlementOptimization:
    type: object
    description: Optimization details and suggestions for an Entitlement based on usage data.
    properties:
      entitlement:
        $ref: '#/definitions/Entitlement'
      suggestedOperation:
        type: string
        description: Suggested optimization operation for the Entitlement.
        enum:
          - Update
          - Disable
          - None
      actions:
        type: array
        description: List of optimization actions with suggested removals based on usage analysis.
        items:
          $ref: '#/definitions/OptimizationAction'
      policiesLinked:
        type: array
        description: IDs of policies linked to this Entitlement.
        items:
          type: string
          format: uuid
        example:
          - a1b2c3d4-e5f6-7890-abcd-ef1234567890
      actionUsage:
        type: string
        description: Overall usage classification across all actions in this Entitlement.
        enum:
          - NoUsage
          - NoUnusedItems
          - UnusedHostsOrPorts
          - NotApplicable
        example: UnusedHostsOrPorts
      broadRules:
        type: string
        description: Whether broad IP ranges were detected across actions in this Entitlement.
        enum:
          - NoRangesDetected
          - RangesDetected
        example: RangesDetected
      recommendedDays:
        type: integer
        description: Recommended number of days of usage data to consider for optimization.
        example: 30
      remainingDays:
        type: integer
        description: Number of days remaining until the optimization recommendation expires.
        example: 7
  OptimizationAction:
    type: object
    description: An IP access action with optimization analysis results for its hosts and ports/types.
    properties:
      action:
        $ref: '#/definitions/IpAccessActionType'
      subtype:
        $ref: '#/definitions/IpAccessSubtype'
      hosts:
        type: array
        description: Hosts with their optimization analysis results.
        items:
          $ref: '#/definitions/OptimizableValue'
      portsOrTypes:
        type: array
        description: Ports or ICMP types with their optimization analysis results.
        items:
          $ref: '#/definitions/OptimizableValue'
  OptimizableValue:
    type: object
    description: A single value (host, port, or type) with its optimization analysis metadata.
    properties:
      value:
        type: string
        description: The host, port, or type value.
        example: 10.0.0.1
      range:
        type: string
        description: Optimization range classification for this value.
        enum:
          - Broad
          - Partial
          - None
      exempted:
        type: boolean
        description: Whether this value is exempt from optimization analysis.
      suggestedForRemoval:
        type: boolean
        description: Whether this value is suggested to be removed based on usage analysis.
  EntitlementMigrationInfo:
    type: object
    description: Migration details of a specific Action of a specific Entitlement.
    properties:
      entitlementId:
        type: string
        format: uuid
        description: ID of the Entitlement.
        example: f691e13f-06b4-4340-853c-fec61f2d9f9f
      entitlementName:
        type: string
        description: The name of the Entitlement.
        example: Entitlement A
      actionIndex:
        type: number
        description: The index of the Action containing the changed host.
        example: 0
      hostIndex:
        type: number
        description: The index of the changed Action.
        example: 2
      originalHost:
        type: string
        description: The value before being migrated.
        example: "gcp://natIP:true"
      updatedHost:
        type: string
        description: >-
          The value after being migrated. This can be the same as originalHost if problems were encountered
          while migrating the value.
        example: "gcp://{\"public-ips\":true}"
      migrationErrors:
        type: array
        description: A list of any error messages encountered while migrating this value.
        items:
          type: string
          example: "WARNING [translate] resolver type of illumio is not configured: tag:gateway"

  GroupNamesList:
    allOf:
      - $ref: './common.yml#/definitions/ResultList'
      - type: object
        description: Represents a list of app shortcut group names currently in use.
        properties:
          data:
            type: array
            description: List of group names currently in use.
            items:
              type: string
              example: Group 1
  EntitlementMigrationInfoList:
    allOf:
      - $ref: './common.yml#/definitions/ResultList'
      - type: object
        description: Represents a list of migrated Entitlement Actions.
        properties:
          data:
            type: array
            items:
              $ref: '#/definitions/EntitlementMigrationInfo'

