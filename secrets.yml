secrets:
  get:
    summary: List all Secrets.
    description: List all Secrets visible to current user.
    tags:
      - Secrets Manager
    parameters:
      - $ref: './common.yml#/parameters/query'
      - $ref: './common.yml#/parameters/range'
      - $ref: './common.yml#/parameters/orderBy'
      - $ref: './common.yml#/parameters/descending'
      - $ref: './common.yml#/parameters/filterBy'
    responses:
      '200':
        description: List of Secrets.
        content:
          application/json:
            schema:
              $ref: '#/definitions/SecretList'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
  post:
    summary: Create a new Secret.
    description: Create a new Secret.
    tags:
      - Secrets Manager
    responses:
      '200':
        description: Created Secret.
        content:
          application/json:
            schema:
              $ref: '#/definitions/Secret'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '409':
        $ref: './common.yml#/responses/ConflictError'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      $ref: '#/requestBodies/SecretCreate'
secrets-bulk-upsert:
  post:
    summary: Bulk upsert Secrets.
    description: Create or update multiple secrets in a single request.
    tags:
      - Secrets
    responses:
      '200':
        description: Bulk upsert report.
        content:
          application/json:
            schema:
              $ref: './common.yml#/definitions/BulkUpsertReport'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      required: true
      description: Bulk upsert request.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/Secret'
secrets-id:
  get:
    summary: Get a specific Secret.
    description: Get a specific Secret.
    tags:
      - Secrets Manager
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Single Secret.
        content:
          application/json:
            schema:
              $ref: '#/definitions/Secret'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
  put:
    summary: Update an existing Secret.
    description: Update an existing Secret.
    tags:
      - Secrets Manager
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Updated Secret.
        content:
          application/json:
            schema:
              $ref: '#/definitions/Secret'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      $ref: '#/requestBodies/Secret'
  delete:
    summary: Delete a specific Secret.
    description: Delete a specific Secret.
    tags:
      - Secrets Manager
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '204':
        description: Secret was deleted successfully.
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'

requestBodies:
  Secret:
    content:
      application/json:
        schema:
          $ref: '#/definitions/Secret'
    description: Secret object.
    required: true
  SecretCreate:
    content:
      application/json:
        schema:
          $ref: '#/definitions/SecretCreate'
    description: Secret object.
    required: true

definitions:
  SecretList:
    allOf:
      - $ref: './common.yml#/definitions/ResultList'
      - type: object
        description: Represents a list of Secrets.
        properties:
          data:
            type: array
            description: List of Secrets.
            items:
              $ref: '#/definitions/Secret'
  Secret:
    type: object
    discriminator:
      propertyName: type
      mapping:
        Generic: '#/definitions/GenericSecret'
        Credentials: '#/definitions/CredentialsSecret'
        SshKey: '#/definitions/SshKeySecret'
  SecretCreate:
    type: object
    discriminator:
      propertyName: type
      mapping:
        Generic: '#/definitions/GenericSecretCreate'
        Credentials: '#/definitions/CredentialsSecretCreate'
        SshKey: '#/definitions/SshKeySecretCreate'
  BaseSecret:
    allOf:
      - $ref: './common.yml#/definitions/BaseEntity'
      - type: object
        description: Represents a Secret.
        properties:
          type:
            type: string
            description: The type of the Secret. Defaults to Generic if omitted.
            default: Generic
            enum:
              - Generic
              - Credentials
              - SshKey
  GenericSecret:
    allOf:
      - $ref: '#/definitions/BaseSecret'
      - type: object
        description: Represents a generic string Secret.
        properties:
          secret:
            type: string
            format: password
            writeOnly: true
            description: Secret string to store in Controller. Omit the field to keep the old value when updating.
            example: 'tSW3!QBv(rj{UuLY'
  GenericSecretCreate:
    allOf:
      - $ref: '#/definitions/BaseSecret'
      - type: object
        description: Represents a generic string Secret.
        required:
          - secret
        properties:
          secret:
            type: string
            format: password
            writeOnly: true
            description: Secret string to store in Controller.
            example: 'tSW3!QBv(rj{UuLY'
  CredentialsSecret:
    allOf:
      - $ref: '#/definitions/BaseSecret'
      - type: object
        description: Represents a username/password credentials Secret.
        required:
          - username
        properties:
          username:
            type: string
            description: Username for the credentials.
            example: 'admin'
          password:
            type: string
            format: password
            writeOnly: true
            description: Password for the credentials. Omit the field to keep the old value when updating.
            example: 'tSW3!QBv(rj{UuLY'
  CredentialsSecretCreate:
    allOf:
      - $ref: '#/definitions/BaseSecret'
      - type: object
        description: Represents a username/password credentials Secret.
        required:
          - username
          - password
        properties:
          username:
            type: string
            description: Username for the credentials.
            example: 'admin'
          password:
            type: string
            format: password
            writeOnly: true
            description: Password for the credentials.
            example: 'tSW3!QBv(rj{UuLY'
  SshKeySecret:
    allOf:
      - $ref: '#/definitions/BaseSecret'
      - type: object
        description: Represents an SSH key Secret.
        required:
          - username
        properties:
          username:
            type: string
            description: Username for the SSH key.
            example: 'admin'
          privateKey:
            type: string
            format: password
            writeOnly: true
            description: SSH private key. Omit the field to keep the old value when updating.
            example: '-----BEGIN OPENSSH PRIVATE KEY-----\n...\n-----END OPENSSH PRIVATE KEY-----'
  SshKeySecretCreate:
    allOf:
      - $ref: '#/definitions/BaseSecret'
      - type: object
        description: Represents an SSH key Secret.
        required:
          - username
          - privateKey
        properties:
          username:
            type: string
            description: Username for the SSH key.
            example: 'admin'
          privateKey:
            type: string
            format: password
            writeOnly: true
            description: SSH private key.
            example: '-----BEGIN OPENSSH PRIVATE KEY-----\n...\n-----END OPENSSH PRIVATE KEY-----'

components:
  schemas:
    Secret:
      $ref: '#/definitions/Secret'
