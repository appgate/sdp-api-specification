protocol-templates:
  get:
    summary: List all Protocol Templates.
    description: List all Protocol Templates.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/query'
      - $ref: './common.yml#/parameters/range'
      - $ref: './common.yml#/parameters/orderBy'
      - $ref: './common.yml#/parameters/descending'
      - $ref: './common.yml#/parameters/filterBy'
    responses:
      '200':
        description: List of Protocol Templates.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ProtocolTemplateList'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
  post:
    summary: Create a new Protocol Template.
    description: Create a new Protocol Template.
    tags:
      - Entitlements
    responses:
      '200':
        description: Created Protocol Template.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ProtocolTemplate'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '409':
        $ref: './common.yml#/responses/ConflictError'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      $ref: '#/requestBodies/ProtocolTemplate'
protocol-templates-id:
  get:
    summary: Get a specific Protocol Template.
    description: Get a specific Protocol Template.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Single Protocol Template.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ProtocolTemplate'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
  put:
    summary: Update an existing Protocol Template.
    description: Update an existing Protocol Template.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '200':
        description: Updated Protocol Template.
        content:
          application/json:
            schema:
              $ref: '#/definitions/ProtocolTemplate'
      '400':
        $ref: './common.yml#/responses/JsonError'
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '422':
        $ref: './common.yml#/responses/ValidationError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'
    requestBody:
      $ref: '#/requestBodies/ProtocolTemplate'
  delete:
    summary: Delete a specific Protocol Template.
    description: Delete a specific Protocol Template.
    tags:
      - Entitlements
    parameters:
      - $ref: './common.yml#/parameters/id'
    responses:
      '204':
        description: Protocol Template was deleted successfully.
      '401':
        $ref: './common.yml#/responses/TokenError'
      '403':
        $ref: './common.yml#/responses/PermissionError'
      '404':
        $ref: './common.yml#/responses/NotFoundError'
      '406':
        $ref: './common.yml#/responses/NotAcceptableError'
      '500':
        $ref: './common.yml#/responses/UnexpectedError'

requestBodies:
  ProtocolTemplate:
    content:
      application/json:
        schema:
          $ref: '#/definitions/ProtocolTemplate'
    description: Protocol Template object.
    required: true

definitions:
  ProtocolTemplateList:
    allOf:
      - $ref: './common.yml#/definitions/ResultList'
      - type: object
        description: Represents a list of Protocol Templates.
        properties:
          data:
            type: array
            description: List of Protocol Templates.
            items:
              $ref: '#/definitions/ProtocolTemplate'

  ProtocolTemplate:
    type: object
    description: A named template of ports for a specific IP access subtype, used as a shortcut when populating entitlement actions.
    required:
      - name
      - subtype
      - ports
    properties:
      id:
        type: string
        format: uuid
        description: ID of the object.
        example: 4c07bc67-57ea-42dd-b702-c2d6c45419fc
      name:
        type: string
        description: Name of the object.
        example: HTTPS
      notes:
        type: string
        description: Notes for the object. Used for documentation purposes.
        example: Template for HTTPS traffic.
      subtype:
        type: string
        description: IP access subtype this template applies to.
        enum:
          - tcp_up
          - udp_up
      ports:
        type: array
        minItems: 1
        description: Ports the template pre-populates. Each entry may be a port or port range (e.g. "80", "8000-8080").
        items:
          type: string
        example:
          - "443"
          - "8443"
      created:
        type: string
        format: date-time
        description: Create date.
        readOnly: true
      updated:
        type: string
        format: date-time
        description: Last update date.
        readOnly: true
